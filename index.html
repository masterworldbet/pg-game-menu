<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>MASTERWORLD GAME CENTER</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#1d3855}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:Arial,"Noto Sans Thai",sans-serif;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.card{display:block;min-width:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card);text-decoration:none;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:320/440;object-fit:cover}
@media(max-width:800px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.wrap{padding:7px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.wrap{padding:6px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}}
</style>
</head>
<body>
<main class="wrap"><section id="grid" class="grid" aria-label="รายการเกม"></section></main>
<script>
const grid=document.getElementById("grid");
function safeUrl(u){
  try{
    const x=new URL(u,location.href);
    return ["http:","https:"].includes(x.protocol)?x.href:"#";
  }catch{return "#"}
}
fetch("games.json")
  .then(r=>r.json())
  .then(games=>{
    grid.innerHTML="";
    games.forEach(g=>{
      const a=document.createElement("a");
      a.className="card";
      a.href=safeUrl(g.url);
      a.target="_blank";
      a.rel="noopener noreferrer";
      const img=document.createElement("img");
      img.loading="lazy";
      img.src=g.image;
      img.alt="";
      a.appendChild(img);
      grid.appendChild(a);
    });
  });
</script>
</body>
</html>

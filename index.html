<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เกมทั้งหมด</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
body{padding:10px}
.grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  max-width:1400px;
  margin:0 auto;
}
.card{
  display:block;
  overflow:hidden;
  border:1px solid #27466a;
  border-radius:12px;
  background:#0d1b2d;
  aspect-ratio:1/1.18;
  text-decoration:none;
}
.card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  body{padding:7px}
}
@media(max-width:430px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  body{padding:6px}
}
</style>
</head>
<body>
<div id="grid" class="grid"></div>

<script>
async function loadGames(){
  const res = await fetch('./games.json', {cache:'no-store'});
  if(!res.ok) throw new Error('โหลด games.json ไม่สำเร็จ');
  const games = await res.json();

  const grid = document.getElementById('grid');

  games.forEach(game => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = game.url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const img = document.createElement('img');
    img.src = game.image;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function(){
      this.style.display = 'none';
    };

    a.appendChild(img);
    grid.appendChild(a);
  });
}

loadGames().catch(err => {
  console.error(err);
});
</script>
</body>
</html>

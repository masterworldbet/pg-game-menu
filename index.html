<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASTERWORLDBET</title>
<style>
:root{
  --bg:#06101d;--card:#0c1b2c;--line:#244667;
  --accent:#a86cff;--accent2:#5ddcff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
body{padding:10px}
.top{max-width:1400px;margin:0 auto 12px}
.banner{
  min-height:92px;border:1px solid #6241a0;border-radius:16px;
  background:radial-gradient(circle at 50% 0%,#28375c 0,#131f37 45%,#0a1424 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;box-shadow:0 8px 28px rgba(0,0,0,.35);
}
.brand{min-width:0}
.brand h1{
  margin:0;font-size:clamp(25px,5vw,44px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#fff,#d8c6ff,#fff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:2px;opacity:.65}
.play{
  border:1px solid #b98cff;border-radius:10px;padding:12px 18px;
  background:linear-gradient(135deg,#7a42d8,#4b2893);color:#fff;
  font-weight:800;white-space:nowrap;cursor:pointer;
  box-shadow:0 0 18px rgba(168,108,255,.25);
}
.play:hover{box-shadow:0 0 24px rgba(168,108,255,.55)}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:2px}
.tab{
  border:1px solid #294664;background:#0b1829;color:#cbd8e8;
  padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.tab.active,.tab:hover{
  border-color:#9b68ed;color:#fff;box-shadow:0 0 14px rgba(168,108,255,.28)
}
.grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;max-width:1400px;margin:0 auto;
}
.card{
  position:relative;display:block;overflow:hidden;border:1px solid var(--line);
  border-radius:12px;background:var(--card);aspect-ratio:326/440;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{
  transform:translateY(-3px) scale(1.012);
  border-color:#b879ff;
  box-shadow:0 0 6px rgba(93,220,255,.6),0 0 18px rgba(168,108,255,.55),0 0 32px rgba(168,108,255,.22);
  z-index:2;
}
.card img{width:100%;height:100%;display:block;object-fit:cover;cursor:default}
.fav{
  position:absolute;right:7px;top:7px;width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(3,10,20,.72);color:#fff;font-size:20px;line-height:34px;
  cursor:pointer;z-index:3;backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,.3)
}
.fav.active{color:#ff5b91;text-shadow:0 0 10px rgba(255,91,145,.8)}
.scorebar{
  position:absolute;left:7px;right:7px;bottom:7px;height:38px;
  padding:5px 8px;border-radius:9px;
  background:rgba(3,10,20,.82);backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,.10);
  z-index:3;
}
.scoretop{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px}
.scorevalue{font-weight:900;font-size:12px}
.countdown{opacity:.72;font-size:9px}
.track{height:4px;border-radius:99px;background:#26384d;overflow:hidden}
.fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#5ddcff,#a86cff);
  box-shadow:0 0 8px rgba(168,108,255,.55);
  transition:width .35s ease;
}
.empty{grid-column:1/-1;text-align:center;padding:40px;opacity:.65}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:700px){
  body{padding:7px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .banner{min-height:76px;padding:11px 12px}.play{padding:10px 12px;font-size:12px}
  .brand p{font-size:9px}.scorebar{left:5px;right:5px;bottom:5px}
}
@media(max-width:430px){
  body{padding:6px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .banner{border-radius:12px}
  .brand h1{letter-spacing:2px}
  .play{font-size:11px;padding:9px 10px}

  .scorebar{
    left:4px;right:4px;bottom:4px;
    height:32px;
    padding:4px 6px;
    border-radius:8px;
  }
  .scoretop{
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    gap:3px;
    margin-bottom:3px;
    font-size:8px;
    line-height:10px;
    white-space:nowrap;
  }
  .scorevalue{
    flex:1 1 auto;
    min-width:0;
    font-size:9px;
    line-height:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .countdown{
    flex:0 0 auto;
    font-size:7px;
    line-height:9px;
    white-space:nowrap;
  }
  .track{height:4px}
}
</style>
</head>
<body>
<header class="top">
  <div class="banner">
    <div class="brand">
      <h1>MASTERWORLDBET</h1>
      <p>OFFICIAL GAME MENU • MASTERWORLD</p>
    </div>
    <button class="play" id="playNow">เข้าเล่นตอนนี้</button>
  </div>
  <nav class="tabs" aria-label="หมวดเกม">
    <button class="tab active" data-filter="all">ทั้งหมด</button>
    <button class="tab" data-filter="popular">ยอดนิยม</button>
    <button class="tab" data-filter="hit">ฮิต</button>
      <button class="tab" data-filter="favorite">♥ รายการโปรด</button>
  </nav>
</header>

<main id="grid" class="grid"></main>

<script>
const PLAY_URL = "https://masterworldbet.com/games/slot";
const REFRESH_MS = 3 * 60 * 1000;
let games = [];
let currentFilter = "all";
let scoreMap = {};
let nextRefreshAt = Number(
  localStorage.getItem("masterworld_next_refresh") || 0
);

const favorites = new Set(
  JSON.parse(localStorage.getItem("masterworld_favorites") || "[]")
);

function randomScore(){
  return Math.floor(Math.random() * 40) + 60; // 60-99
}

function generateScores(){
  scoreMap = {};
  games.forEach(g => {
    scoreMap[String(g.id)] = randomScore();
  });

  nextRefreshAt = Date.now() + REFRESH_MS;

  localStorage.setItem(
    "masterworld_scores",
    JSON.stringify(scoreMap)
  );
  localStorage.setItem(
    "masterworld_next_refresh",
    String(nextRefreshAt)
  );
}

function saveFavorites(){
  localStorage.setItem("masterworld_favorites",JSON.stringify([...favorites]));
}

async function loadGames(){
  const res = await fetch("./games.json",{cache:"no-store"});
  if(!res.ok) throw new Error("โหลด games.json ไม่สำเร็จ");
  games = await res.json();

  let savedScores = null;
  try {
    savedScores = JSON.parse(
      localStorage.getItem("masterworld_scores") || "null"
    );
  } catch(e) {
    savedScores = null;
  }

  const savedNextRefresh = Number(
    localStorage.getItem("masterworld_next_refresh") || 0
  );

  const hasAllScores =
    savedScores &&
    games.length > 0 &&
    games.every(g =>
      Number.isFinite(Number(savedScores[String(g.id)]))
    );

  if (hasAllScores && savedNextRefresh > Date.now()) {
    scoreMap = savedScores;
    nextRefreshAt = savedNextRefresh;
  } else {
    generateScores();
  }

  render();
}

function filteredGames(){
  let list=[...games];
  if(currentFilter==="favorite") list=list.filter(g=>favorites.has(String(g.id)));
  else if(currentFilter!=="all") list=list.filter(g=>(g.tags||[]).includes(currentFilter));
  if(currentFilter==="popular") {
    list.sort((a,b)=>
      scoreMap[String(b.id)]-scoreMap[String(a.id)]
    );
  }

  return list;
}

function formatCountdown(){
  const remaining=Math.max(0,nextRefreshAt-Date.now());
  const totalSec=Math.ceil(remaining/1000);
  const m=Math.floor(totalSec/60);
  const s=totalSec%60;
  return `สุ่มใหม่ ${m}:${String(s).padStart(2,"0")}`;
}

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const list=filteredGames();

  if(!list.length){
    grid.innerHTML='<div class="empty">ยังไม่มีเกมในรายการโปรด</div>';
    return;
  }

  list.forEach(game=>{
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.src="./images/"+game.image;
    img.alt="";
    img.loading="lazy";
    img.decoding="async";

    // กดที่รูปแล้วจะไม่ไปหน้าอื่น
    img.addEventListener("click",e=>e.preventDefault());

    const fav=document.createElement("button");
    fav.className="fav"+(favorites.has(String(game.id))?" active":"");
    fav.type="button";
    fav.textContent=favorites.has(String(game.id))?"♥":"♡";
    fav.setAttribute("aria-label","เพิ่มหรือลบรายการโปรด");
    fav.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      const id=String(game.id);
      if(favorites.has(id)) favorites.delete(id);
      else favorites.add(id);
      saveFavorites();
      render();
    });

    const scorebar=document.createElement("div");
    scorebar.className="scorebar";

    const scoretop=document.createElement("div");
    scoretop.className="scoretop";

    const scorevalue=document.createElement("span");
    scorevalue.className="scorevalue";
    scorevalue.textContent=`โอกาสชนะ ${scoreMap[String(game.id)]}%`;

    const countdown=document.createElement("span");
    countdown.className="countdown";
    countdown.textContent=formatCountdown();

    scoretop.appendChild(scorevalue);
    scoretop.appendChild(countdown);

    const track=document.createElement("div");
    track.className="track";

    const fill=document.createElement("div");
    fill.className="fill";
    fill.style.width=scoreMap[String(game.id)]+"%";

    track.appendChild(fill);
    scorebar.appendChild(scoretop);
    scorebar.appendChild(track);

    card.appendChild(img);
    card.appendChild(fav);
    card.appendChild(scorebar);
    grid.appendChild(card);
  });
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    currentFilter=btn.dataset.filter;
    render();
  });
});

document.getElementById("playNow").addEventListener("click",()=>{
  window.open(PLAY_URL,"_blank","noopener,noreferrer");
});

// อัปเดตตัวเลขเวลาถอยหลังทุกวินาที
setInterval(()=>{
  if(Date.now()>=nextRefreshAt){
    generateScores();
    render();
    return;
  }
  document.querySelectorAll(".countdown").forEach(el=>{
    el.textContent=formatCountdown();
  });
},1000);

loadGames().catch(err=>{
  console.error(err);
  document.getElementById("grid").innerHTML='<div class="empty">ไม่สามารถโหลดรายการเกมได้</div>';
});
</script>
</body>
</html>

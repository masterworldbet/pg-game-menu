<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>MASTERWORLD GAME CENTER</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--card:#10233a;--line:#1d3855;--text:#f4f8ff;--muted:#91a6bd;--accent:#35c7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0a1727);color:var(--text);font-family:Arial,"Noto Sans Thai",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px 10px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.title{font-size:21px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.search{width:220px;max-width:48%;background:#0b1929;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:11px}.tab.active{background:#123a51;color:#fff;border-color:#237da2}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#2a6f92}
.pic{width:100%;aspect-ratio:320/440;background:#0b1726;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:7px}.name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;gap:5px;align-items:center;margin-top:6px;font-size:9px;color:var(--muted)}.badge{color:#dff7ff;background:#0b536d;border-radius:999px;padding:3px 5px}.bar{height:4px;background:#08121f;border-radius:99px;margin-top:5px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:40px}.footer{text-align:center;color:#71879d;font-size:9px;padding-top:20px}
@media(max-width:800px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.wrap{padding:12px 7px}.name{font-size:10px}.info{padding:6px}.title{font-size:18px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.search{max-width:48%;width:180px}.meta{font-size:8px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="title">🎮 MASTERWORLD GAME CENTER</div><div class="sub">จัดเรียงตามคะแนนสูงสุด • คะแนนเป็นค่าตัวอย่าง</div></div>
<input id="search" class="search" type="search" placeholder="ค้นหาเกม..."></div>
<div class="tabs"><button class="tab active" data-filter="all">ทั้งหมด</button><button class="tab" data-filter="top">คะแนนสูง</button><button class="tab" data-filter="new">รายการล่าสุด</button></div>
<section id="grid" class="grid"></section><div id="empty" class="empty" hidden>ไม่พบเกมที่ค้นหา</div>
<div class="footer">คะแนนเป็นข้อมูลตัวอย่างสำหรับการจัดเรียง ไม่ใช่โอกาสชนะหรือการรับประกันผล</div>
</main>
<script>
const state={games:[],filter:"all",q:""},grid=document.getElementById("grid"),empty=document.getElementById("empty"),search=document.getElementById("search");
function safeUrl(u){try{const x=new URL(u,location.href);return["http:","https:"].includes(x.protocol)?x.href:"#"}catch{return"#"}}
function render(){const q=state.q.trim().toLowerCase();let list=state.games.slice().sort((a,b)=>b.score-a.score).filter(g=>g.name.toLowerCase().includes(q));
if(state.filter==="top")list=list.filter(g=>g.score>=92);if(state.filter==="new")list=list.slice().reverse();grid.innerHTML="";
list.forEach(g=>{const a=document.createElement("a");a.className="card";a.href=safeUrl(g.url);a.target="_blank";a.rel="noopener noreferrer";
a.innerHTML=`<div class="pic"><img loading="lazy" src="${g.image}" alt="${g.name.replace(/"/g,"&quot;")}"></div><div class="info"><div class="name">${g.name}</div><div class="meta"><span>คะแนน</span><span class="badge">${g.score}%</span></div><div class="bar"><div class="fill" style="width:${g.score}%"></div></div></div>`;grid.appendChild(a)});empty.hidden=list.length!==0}
search.addEventListener("input",e=>{state.q=e.target.value;render()});document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.filter=b.dataset.filter;render()}));
fetch("games.json").then(r=>r.json()).then(d=>{state.games=d;render()}).catch(()=>{empty.hidden=false;empty.textContent="โหลดข้อมูลเกมไม่สำเร็จ"});
</script></body></html>
